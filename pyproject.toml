[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-capture-forensics-lab"
version = "1.0.0"
description = "Bounded offline parsing and evidence analysis for owned synthetic PCAP fixtures"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
